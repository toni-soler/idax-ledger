schemaVersion: 1
contractVersion: 1
scaffoldVersion: 1
module:
  key: ledger
  productName: IDAX Ledger
technical:
  javaPackage: es.idynamicsax.ledger
  postgresSchema: idax_ledger
  apiPrefix: /api/ledger
components:
  backend: backend
  frontend: frontend
  main: deployment
permissions:
  - code: LEDGER_READ
    resourceKey: ledger
    fieldKey: null
    actionKey: read
    labelKey: permissions.ledger.read
    apiPath: /api/ledger
    description: Read ledger networks, nodes, ledgers and transactions
  - code: LEDGER_PROOF_CREATE
    resourceKey: ledger.proof
    fieldKey: null
    actionKey: create
    labelKey: permissions.ledger.proof.create
    apiPath: /api/ledger/proofs
    description: Create and anchor ledger proofs
  - code: LEDGER_PROOF_VERIFY
    resourceKey: ledger.proof
    fieldKey: null
    actionKey: verify
    labelKey: permissions.ledger.proof.verify
    apiPath: /api/ledger/proofs/*/verify
    description: Verify proof integrity and ledger anchors
generator:
  directory: backend/scripts/gen-idax-ledger
  config: backend/scripts/gen-idax-ledger/table-config.yml
  command: [python3, scripts/gen-idax-ledger/gen-idax-ledger.py]
validation:
  backend:
    test: [mvn, test]
    package: [mvn, package, -DskipTests]
  frontend:
    i18n: [npm, run, "i18n:validate"]
    test: [npm, test]
    build: [npm, run, build]
